listen_addresses: "127.0.0.1:3000"
web_ui: enable-for-all
cache:
  size_mb: 768
pmtiles:
  skip_signature: true
  region: us-east-1
  sources:
    latest: s3://pmtiles.perrygeo.com/latest.pmtiles
passthrough:
  sources:
    hillshade:
      url: https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
      format: jpg
      minzoom: 0
      maxzoom: 23
      attribution: 'Esri'
    # EOX Sentinel-2 cloudless (2020) satellite mosaic, proxied through
    # Martin's passthrough source. Martin's `cache.size_mb` tile cache does the
    # in-memory caching (replacing climate-changed's application-level cache).
    #
    # WMTS order: the EOX endpoint is {TileMatrix}/{TileRow}/{TileCol}, so the
    # template must be {z}/{y}/{x} — NOT the {z}/{x}/{y} XYZ order.
    # EOX serves this layer up to zoom 18.
    s2cloudless:
      url: https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg
      format: jpg
      minzoom: 0
      maxzoom: 18
      attribution: 'Sentinel-2 cloudless 2020 © EOX (CC BY-NC-SA 4.0)'
