listen_addresses: "127.0.0.1:3000"
web_ui: enable-for-all
cache:
  # t3.small has 2 GiB total. The box idles around ~0.5 GiB used, so give
  # Martin the spare memory as cache while keeping ~0.5 GiB headroom for the
  # OS, nginx, and nixos-rebuild.
  #
  # Martin's default `size_mb` split is 50% tiles / 25% pmtiles-dir / 12.5%
  # fonts / 12.5% sprites. Fonts and sprites are served by nginx from assets/,
  # not by Martin, so their caches are disabled and that memory goes to the
  # tile cache instead.
  size_mb: 1280
  # Main tile cache: holds frequently-requested tiles so CloudFront misses
  # don't round-trip to S3 / EOX / Esri.
  tile_size_mb: 1024
pmtiles:
  skip_signature: true
  region: us-east-1
  directory_cache:
    # A single PMTiles directory is small; this keeps it resident so S3-backed
    # sources don't re-resolve the directory per request.
    size_mb: 256
  sources:
    latest: s3://pmtiles.perrygeo.com/latest.pmtiles
fonts:
  cache: disable
sprites:
  cache: disable
passthrough:
  sources:
    hillshade:
      url: https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
      format: jpg
      minzoom: 0
      maxzoom: 23
      attribution: 'Esri'
    # EOX Sentinel-2 cloudless (2020) satellite mosaic, proxied through
    # Martin's passthrough source. Martin's `cache.size_mb` tile cache does the
    # in-memory caching (replacing climate-changed's application-level cache).
    #
    # WMTS order: the EOX endpoint is {TileMatrix}/{TileRow}/{TileCol}, so the
    # template must be {z}/{y}/{x} — NOT the {z}/{x}/{y} XYZ order.
    # EOX serves this layer up to zoom 18.
    s2cloudless:
      url: https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg
      format: jpg
      minzoom: 0
      maxzoom: 18
      attribution: 'Sentinel-2 cloudless 2020 © EOX (CC BY-NC-SA 4.0)'
